services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: brokeros-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - brokeros_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - brokeros-network

  api:
    container_name: brokeros-api
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=BrokerOS;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Jwt__Issuer: BrokerOS
      Jwt__Audience: BrokerOS.Web
      Jwt__Key: ${JWT_KEY}
      Jwt__ExpiryHours: "8"
      BrokerOS__ApplyMigrationsOnStartup: "true"
      BrokerOS__SeedDemoDataOnStartup: ${SEED_DEMO_DATA:-true}
      BrokerOS__EnableDemoReset: ${ENABLE_DEMO_RESET:-true}
      BrokerOS__EnableSwagger: ${ENABLE_SWAGGER:-true}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brokeros-network

  web:
    container_name: brokeros-web
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_ENABLE_DEMO_RESET: ${ENABLE_DEMO_RESET:-true}
    restart: unless-stopped
    ports:
      - "3000:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brokeros-network

volumes:
  brokeros_sql_data:

networks:
  brokeros-network:
    driver: bridge
